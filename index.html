<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Detective - Professional Image Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #020617 0%, #0f172a 100%); }
        .loader { border-top-color: #3b82f6; animation: spinner 1.2s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen flex flex-col items-center p-6 font-sans">

    <header class="mt-10 mb-10 text-center">
        <h1 class="text-5xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-400">AI DETECTIVE</h1>
        <p class="text-slate-500 mt-2 font-medium tracking-widest uppercase text-xs">Global Content Verification Node</p>
    </header>

    <main class="w-full max-w-xl bg-slate-900/60 backdrop-blur-xl border border-slate-800 p-8 rounded-[2.5rem] shadow-2xl">
        <div id="drop-area" class="border-2 border-dashed border-slate-700 rounded-3xl p-10 text-center hover:border-blue-500 transition-all cursor-pointer bg-slate-950/30">
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <div id="preview-container" class="hidden mb-4">
                <img id="image-preview" class="max-h-48 mx-auto rounded-lg shadow-lg">
            </div>
            <p id="file-name" class="text-slate-400">Tap to upload or drag image</p>
        </div>

        <button id="analyzeBtn" class="w-full mt-8 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 py-4 rounded-2xl font-bold text-lg transition-all shadow-lg shadow-blue-900/20 active:scale-95">
            ANALYZE PIXELS
        </button>

        <div id="loading" class="hidden mt-10 text-center">
            <div class="loader w-14 h-14 border-4 border-slate-800 rounded-full mx-auto"></div>
            <p class="mt-4 text-blue-400 font-mono text-sm animate-pulse">Scanning Neural Patterns...</p>
        </div>

        <div id="result" class="hidden mt-10 p-6 bg-slate-900/80 rounded-3xl border border-blue-500/20 text-center">
            <p class="text-[10px] text-slate-500 uppercase tracking-[0.2em] mb-2">Final Verdict</p>
            <div id="status" class="text-4xl font-black mb-2"></div>
            <div id="confidence-bar" class="w-full bg-slate-800 h-2 rounded-full mt-4 overflow-hidden">
                <div id="confidence-fill" class="h-full bg-blue-500 transition-all duration-1000"></div>
            </div>
            <p id="confidence" class="text-slate-500 text-xs mt-3 font-mono"></p>
        </div>
    </main>

    <footer class="mt-auto py-8 text-slate-700 text-[9px] tracking-[0.3em] uppercase">
        Verified by AI Detective Engine &copy; 2026
    </footer>

    <script>
        // التوكين بتاعك تم تركيبه بنجاح هنا
        const API_TOKEN = "Hf_fyRttkLYwUXpTCHshRzgsRZFjdswapEIGi"; 
        
        const fileInput = document.getElementById('fileInput');
        const dropArea = document.getElementById('drop-area');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const statusEl = document.getElementById('status');
        const confidenceFill = document.getElementById('confidence-fill');

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('file-name').innerText = file.name;
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('image-preview').src = event.target.result;
                    document.getElementById('preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        dropArea.onclick = () => fileInput.click();

        async function query(file) {
            const data = await file.arrayBuffer();
            const response = await fetch(
                "https://api-inference.huggingface.co/models/umm-maybe/AI-image-detector",
                {
                    headers: { Authorization: `Bearer ${API_TOKEN}` },
                    method: "POST",
                    body: data,
                }
            );
            return await response.json();
        }

        analyzeBtn.onclick = async () => {
            if(!fileInput.files[0]) return alert("Please select an image first!");
            
            analyzeBtn.classList.add('hidden');
            resultDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');

            try {
                const response = await query(fileInput.files[0]);
                
                // البحث عن نتيجة الـ AI في المصفوفة
                const aiResult = response.find(item => item.label === 'ai');
                const aiScore = aiResult ? aiResult.score : 0;
                const isAI = aiScore > 0.5;

                loadingDiv.classList.add('hidden');
                resultDiv.classList.remove('hidden');
                analyzeBtn.classList.remove('hidden');

                statusEl.innerText = isAI ? "AI GENERATED" : "HUMAN MADE";
                statusEl.className = isAI ? "text-4xl font-black text-red-500" : "text-4xl font-black text-emerald-500";
                
                const percentage = (aiScore * 100).toFixed(1);
                confidenceFill.style.width = percentage + "%";
                confidenceFill.className = isAI ? "h-full bg-red-600 transition-all duration-1000" : "h-full bg-emerald-600 transition-all duration-1000";
                document.getElementById('confidence').innerText = `Probability: ${percentage}%`;
                
            } catch (error) {
                console.error(error);
                alert("The AI brain is waking up! Please try again in 5 seconds.");
                analyzeBtn.classList.remove('hidden');
                loadingDiv.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
