<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Detector - Global Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen flex flex-col items-center justify-center p-4">

    <header class="mb-10 text-center">
        <h1 class="text-4xl font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">AI DETECTIVE</h1>
        <p class="text-slate-400 tracking-widest uppercase text-sm">Check if it's Real or AI Generated</p>
    </header>

    <div class="bg-slate-800/50 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-700">
        <div id="drop-area" class="border-2 border-dashed border-slate-600 rounded-2xl p-12 text-center cursor-pointer hover:border-blue-500 transition-all group">
            <div class="mb-4 flex justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-500 group-hover:text-blue-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            </div>
            <p class="text-slate-300">Drop your image here or <span class="text-blue-400 font-semibold">Browse</span></p>
            <input type="file" id="fileElem" accept="image/*" class="hidden">
        </div>

        <button id="scan-btn" class="mt-8 w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-900/20 transition-all transform active:scale-95 uppercase tracking-wider">
            Start Analysis
        </button>
    </div>

    <div class="mt-10 bg-slate-800/30 p-2 rounded-xl border border-slate-700/50 text-center w-full max-w-lg">
        <p class="text-[10px] text-slate-600 uppercase mb-1">Sponsored Content</p>
        <div class="h-24 bg-slate-900/50 flex items-center justify-center rounded-lg border border-slate-700">
            <span class="text-slate-700 text-sm italic italic">Ad Slot - Google AdSense</span>
        </div>
    </div>

    <footer class="mt-12 text-slate-500 text-xs">
        &copy; 2026 AI Detective Service - Global Analytics
    </footer>

    <script>
        // سكريبت بسيط لتجربة الزر
        document.getElementById('scan-btn').onclick = function() {
            alert('Wait! We are building the AI Brain now... The Interface is Ready!');
        };
    </script>
</body>
</html>
