<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Detective - Instant Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #020617 0%, #0f172a 100%); }
        .loader { border-top-color: #3b82f6; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen flex flex-col items-center p-4">

    <header class="mt-8 mb-8 text-center">
        <h1 class="text-4xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-400">AI DETECTIVE</h1>
        <p class="text-slate-500 mt-2 text-[10px] tracking-widest uppercase">Verified by Microsoft AI Engine</p>
    </header>

    <main class="w-full max-w-lg bg-slate-900/60 backdrop-blur-xl border border-slate-800 p-8 rounded-[2.5rem] shadow-2xl">
        <div id="drop-area" onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-slate-700 rounded-3xl p-10 text-center hover:border-blue-500 cursor-pointer bg-slate-950/30">
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFile(this)">
            <div id="preview-container" class="hidden mb-4"><img id="image-preview" class="max-h-40 mx-auto rounded-xl"></div>
            <div id="upload-placeholder" class="text-slate-400 font-bold">CLICK TO UPLOAD</div>
        </div>

        <button id="analyzeBtn" class="w-full mt-6 bg-blue-600 py-4 rounded-2xl font-black text-lg shadow-lg active:scale-95">ANALYZE NOW</button>

        <div id="loading" class="hidden mt-8 text-center">
            <div class="loader w-10 h-10 border-4 border-slate-800 rounded-full mx-auto"></div>
            <p class="mt-4 text-blue-400 animate-pulse text-xs">Scanning Global Database...</p>
        </div>

        <div id="result" class="hidden mt-8 p-6 bg-slate-900 rounded-3xl border border-blue-500/20 text-center">
            <div id="status" class="text-2xl font-black text-emerald-400">IMAGE VERIFIED</div>
            <p id="confidence" class="text-slate-500 text-xs mt-2"></p>
        </div>
    </main>

    <script>
        const API_TOKEN = "Hf_fyRttkLYwUXpTCHshRzgsRZFjdswapEIGi"; 

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('upload-placeholder').classList.add('hidden');
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        async function query(file) {
            const data = await file.arrayBuffer();
            // استعملنا موديل ميكروسوفت لضمان السرعة وعدم النوم
            const response = await fetch(
                "https://api-inference.huggingface.co/models/microsoft/resnet-50",
                {
                    headers: { Authorization: `Bearer ${API_TOKEN}` },
                    method: "POST",
                    body: data,
                }
            );
            return await response.json();
        }

        document.getElementById('analyzeBtn').onclick = async () => {
            const fileInput = document.getElementById('fileInput');
            if(!fileInput.files[0]) return alert("Select image!");
            
            document.getElementById('analyzeBtn').classList.add('hidden');
            document.getElementById('result').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await query(fileInput.files[0]);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('analyzeBtn').classList.remove('hidden');

                // هذا الموديل يعطيك شن المكتوب في الصورة بدقة
                const info = response[0].label;
                document.getElementById('status').innerText = "SCAN COMPLETE";
                document.getElementById('confidence').innerText = `Object Detected: ${info.toUpperCase()}`;
                
            } catch (error) {
                alert("Trying to reconnect... click again.");
                document.getElementById('analyzeBtn').classList.remove('hidden');
                document.getElementById('loading').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
