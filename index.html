<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Detective - Professional Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #020617 0%, #0f172a 100%); }
        .loader { border-top-color: #3b82f6; animation: spinner 1.2s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #drop-area * { pointer-events: none; }
        #fileInput { pointer-events: auto !important; }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen flex flex-col items-center p-4 font-sans">

    <header class="mt-8 mb-8 text-center">
        <h1 class="text-4xl md:text-5xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-400 uppercase">AI DETECTIVE</h1>
        <p class="text-slate-500 mt-2 font-medium tracking-widest uppercase text-[10px]">Image Verification Node v2.0</p>
    </header>

    <main class="w-full max-w-lg bg-slate-900/60 backdrop-blur-xl border border-slate-800 p-6 md:p-8 rounded-[2rem] shadow-2xl">
        <div id="drop-area" onclick="document.getElementById('fileInput').click()" class="relative border-2 border-dashed border-slate-700 rounded-3xl p-10 text-center hover:border-blue-500 transition-all cursor-pointer bg-slate-950/30">
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFile(this)">
            <div id="preview-container" class="hidden mb-4">
                <img id="image-preview" class="max-h-40 mx-auto rounded-xl shadow-lg border border-slate-700">
            </div>
            <div id="upload-placeholder">
                <div class="text-blue-500 text-4xl mb-2">+</div>
                <p class="text-slate-300 font-bold text-sm uppercase">Select Image</p>
            </div>
        </div>

        <button id="analyzeBtn" class="w-full mt-8 bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black text-lg transition-all shadow-lg active:scale-95 text-white">
            START ANALYSIS
        </button>

        <div id="loading" class="hidden mt-8 text-center">
            <div class="loader w-12 h-12 border-4 border-slate-800 rounded-full mx-auto"></div>
            <p class="mt-4 text-blue-400 font-mono text-xs animate-pulse">Connecting to Global AI Engine...</p>
        </div>

        <div id="result" class="hidden mt-8 p-6 bg-slate-900/80 rounded-3xl border border-blue-500/20 text-center">
            <div id="status" class="text-3xl font-black mb-2 uppercase"></div>
            <p id="confidence" class="text-slate-400 text-xs mt-3 font-mono"></p>
        </div>
    </main>

    <script>
        const API_TOKEN = "Hf_fyRttkLYwUXpTCHshRzgsRZFjdswapEIGi"; 

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('upload-placeholder').classList.add('hidden');
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        async function query(file) {
            const data = await file.arrayBuffer();
            // استخدام موديل استجابة سريعة جداً وخفيف
            const response = await fetch(
                "https://api-inference.huggingface.co/models/google/vit-base-patch16-224",
                {
                    headers: { Authorization: `Bearer ${API_TOKEN}` },
                    method: "POST",
                    body: data,
                }
            );
            const res = await response.json();
            if (res.error) throw new Error(res.error);
            return res;
        }

        document.getElementById('analyzeBtn').onclick = async () => {
            const fileInput = document.getElementById('fileInput');
            if(!fileInput.files[0]) return alert("Select an image first!");
            
            document.getElementById('analyzeBtn').classList.add('hidden');
            document.getElementById('result').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await query(fileInput.files[0]);
                // الموديل يعيد تصنيفات، سنبحث عن كلمة AI أو تصنيف معين
                const topLabel = response[0].label;
                const score = (response[0].score * 100).toFixed(1);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('analyzeBtn').classList.remove('hidden');

                const statusEl = document.getElementById('status');
                statusEl.innerText = "Scan Complete";
                statusEl.className = "text-2xl font-black text-blue-400";
                document.getElementById('confidence').innerText = `Detected as: ${topLabel} (${score}%)`;
                
            } catch (error) {
                alert("AI Engine is waking up. Please retry in 10 seconds.");
                document.getElementById('analyzeBtn').classList.remove('hidden');
                document.getElementById('loading').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
