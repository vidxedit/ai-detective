<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Detective - Real or Generated?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #020617 0%, #0f172a 100%); }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen font-sans flex flex-col items-center p-6">

    <header class="mt-10 mb-10 text-center">
        <h1 class="text-5xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">AI DETECTIVE</h1>
        <p class="text-slate-500 mt-2">Professional AI Content Analysis Service</p>
    </header>

    <main class="w-full max-w-2xl bg-slate-900/80 backdrop-blur-md border border-slate-800 p-8 rounded-3xl shadow-2xl">
        <div id="drop-area" class="border-2 border-dashed border-slate-700 rounded-2xl p-12 text-center hover:border-blue-500 transition-all cursor-pointer">
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <p id="file-name" class="text-slate-400">Drag image here or <span class="text-blue-500 font-bold">Upload</span></p>
        </div>

        <button id="analyzeBtn" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold text-lg transition-all shadow-lg shadow-blue-900/40">
            START ANALYSIS
        </button>

        <div id="loading" class="hidden mt-8 text-center">
            <div class="loader w-12 h-12 border-4 border-slate-700 rounded-full mx-auto"></div>
            <p class="mt-4 text-blue-400 font-mono animate-pulse">Analyzing Pixels... Please wait</p>
            <div class="mt-4 p-4 bg-slate-800 rounded-lg text-[10px] text-slate-600">SPONSORED AD SLOT</div>
        </div>

        <div id="result" class="hidden mt-8 p-6 bg-slate-800 rounded-2xl border border-blue-900/30">
            <h3 class="text-xl font-bold mb-4 flex items-center">
                <span class="mr-2">🔍</span> Analysis Result:
            </h3>
            <div id="status" class="text-3xl font-black mb-4"></div>
            <div class="p-4 bg-black/40 rounded-xl">
                <p class="text-xs text-slate-500 uppercase font-bold mb-2">Extracted Prompt:</p>
                <p id="promptText" class="text-slate-300 italic text-sm"></p>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-10 text-slate-600 text-[10px] tracking-widest uppercase">
        Global AI Verification Node &copy; 2026
    </footer>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropArea = document.getElementById('drop-area');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');

        dropArea.onclick = () => fileInput.click();

        analyzeBtn.onclick = async () => {
            if(!fileInput.files[0]) return alert("Please upload an image first!");
            
            analyzeBtn.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            resultDiv.classList.add('hidden');

            // محاكاة للتحليل (سيتم ربط الـ API الحقيقي هنا في الخطوة التالية)
            setTimeout(() => {
                loadingDiv.classList.add('hidden');
                resultDiv.classList.remove('hidden');
                analyzeBtn.classList.remove('hidden');
                
                // نتيجة تجريبية
                document.getElementById('status').innerText = "98% AI GENERATED";
                document.getElementById('status').className = "text-3xl font-black mb-4 text-red-500";
                document.getElementById('promptText').innerText = "A hyper-realistic cinematic portrait, neon lighting, futuristic atmosphere, 8k resolution, detailed textures.";
            }, 3000);
        };
    </script>
</body>
</html>
