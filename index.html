<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Detective - Official Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #020617 0%, #0f172a 100%); }
        .loader { border-top-color: #3b82f6; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #drop-area * { pointer-events: none; }
        #fileInput { pointer-events: auto !important; }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen flex flex-col items-center p-4 font-sans">

    <header class="mt-8 mb-8 text-center">
        <h1 class="text-4xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-400">AI DETECTIVE</h1>
        <p class="text-slate-500 mt-2 text-[10px] tracking-widest uppercase">Deep Learning Image Forensic Lab</p>
    </header>

    <main class="w-full max-w-lg bg-slate-900/60 backdrop-blur-xl border border-slate-800 p-8 rounded-[2.5rem] shadow-2xl">
        <div id="drop-area" onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-slate-700 rounded-3xl p-10 text-center hover:border-blue-500 transition-all cursor-pointer bg-slate-950/30">
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFile(this)">
            <div id="preview-container" class="hidden mb-4"><img id="image-preview" class="max-h-40 mx-auto rounded-xl border border-slate-700"></div>
            <div id="upload-placeholder">
                <p class="text-slate-300 font-bold text-sm">UPLOAD IMAGE TO SCAN</p>
            </div>
        </div>

        <button id="analyzeBtn" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all text-white">START SCANNING</button>

        <div id="loading" class="hidden mt-8 text-center">
            <div class="loader w-10 h-10 border-4 border-slate-800 rounded-full mx-auto"></div>
            <p class="mt-4 text-blue-400 animate-pulse text-xs font-mono">Analyzing Pixel Distribution...</p>
        </div>

        <div id="result" class="hidden mt-8 p-6 bg-slate-900 rounded-3xl border border-blue-500/20 text-center">
            <p class="text-slate-500 text-[10px] uppercase tracking-widest mb-2">Final Verdict</p>
            <div id="status" class="text-3xl font-black mb-2"></div>
            <div id="confidence-bar" class="w-full bg-slate-800 h-1.5 rounded-full mt-4 overflow-hidden">
                <div id="confidence-fill" class="h-full bg-blue-500 transition-all duration-1000"></div>
            </div>
            <p id="confidence-text" class="text-slate-500 text-[10px] mt-3 font-mono"></p>
        </div>
    </main>

    <script>
        const API_TOKEN = "Hf_fyRttkLYwUXpTCHshRzgsRZFjdswapEIGi"; 

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('upload-placeholder').classList.add('hidden');
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        async function query(file) {
            const data = await file.arrayBuffer();
            // استعملنا موديل كشف تزييف متخصص (AI Detector)
            const response = await fetch(
                "https://api-inference.huggingface.co/models/ArtifactAI/ai-image-detector",
                {
                    headers: { Authorization: `Bearer ${API_TOKEN}` },
                    method: "POST",
                    body: data,
                }
            );
            return await response.json();
        }

        document.getElementById('analyzeBtn').onclick = async () => {
            const fileInput = document.getElementById('fileInput');
            if(!fileInput.files[0]) return alert("Please select an image!");
            
            document.getElementById('analyzeBtn').classList.add('hidden');
            document.getElementById('result').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await query(fileInput.files[0]);
                
                // البحث عن نتيجة الذكاء الاصطناعي في الرد
                // الموديل يعيد قائمة، نأخذ العنصر اللي فيه "label": "artificial" أو "ai"
                const aiResult = response.find(x => x.label.toLowerCase().includes('ai') || x.label.toLowerCase().includes('artif'));
                const aiScore = aiResult ? aiResult.score : 0;
                const isAI = aiScore > 0.5;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('analyzeBtn').classList.remove('hidden');

                const statusEl = document.getElementById('status');
                const fillEl = document.getElementById('confidence-fill');
                
                statusEl.innerText = isAI ? "AI GENERATED" : "HUMAN MADE";
                statusEl.className = isAI ? "text-3xl font-black text-red-500" : "text-3xl font-black text-emerald-500";
                
                const percentage = (aiScore * 100).toFixed(1);
                fillEl.style.width = isAI ? percentage + "%" : (100 - percentage) + "%";
                fillEl.className = isAI ? "h-full bg-red-600" : "h-full bg-emerald-600";
                
                document.getElementById('confidence-text').innerText = `AI PROBABILITY: ${percentage}%`;
                
            } catch (error) {
                alert("The AI server is waking up (Warm up). Click 'Start' again in 10 seconds.");
                document.getElementById('analyzeBtn').classList.remove('hidden');
                document.getElementById('loading').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
